set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g mode-keys vi
set -g default-terminal 'tmux-256color'

# Colours name the 16 palette slots so they follow tty-theme. Backgrounds stay
# in slots 0-7 because the Linux console cannot show bright backgrounds here.
set -g status-style 'bg=default,fg=white'
set -g status-left-length 20
set -g status-left '#[fg=black,bg=blue,bold] #S #[default] '
set -g status-right '#[fg=brightblack]%Y-%m-%d #[fg=white]%H:%M '
setw -g window-status-format '#[fg=brightblack] #I #W#{?window_zoomed_flag, +,} '
setw -g window-status-current-format '#[fg=yellow,bold] #I #W#{?window_zoomed_flag, +,} '
setw -g window-status-separator ''
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'fg=black,bg=yellow'
set -g message-command-style 'fg=yellow,bg=default'
setw -g mode-style 'fg=black,bg=yellow'
set -g display-panes-active-colour blue
set -g display-panes-colour brightblack
setw -g clock-mode-colour blue

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind Tab last-window
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
